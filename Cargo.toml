[workspace]
resolver = "3"

members = [
    # Subdominio basico
    "bctx/core",

    # Subdominios de soporte
    "bctx/auth",
    "bctx/common",

    # API
    "cmd/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Con resolver 3 la resolución de dependencias respeta esta versión mínima.
rust-version = "1.99"
publish = false

# Las reglas de CLAUDE.md como lints: sin unwrap/expect/panic en producción (en los tests sí,
# ver clippy.toml), sin unsafe y sin salidas por stdout/stderr (van por tracing).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Módulos de archivo (foo.rs + foo/), como pide CLAUDE.md: nada de mod.rs.
mod_module_files = "warn"

# Versiones compartidas, declaradas una sola vez.
[workspace.dependencies]
async-trait = "0.1.92"
chrono = "0.4.42"
chrono-tz = "0.10.4"
regex = "1.11"
thiserror = "2.0.16"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.18", features = ["v4"] }

# bcrypt es lento a propósito; sin optimizar, cada login en desarrollo y en los tests tardaba
# ~0,9 s en lugar de ~0,25 s.
[profile.dev.package.bcrypt]
opt-level = 3

[profile.dev.package.blowfish]
opt-level = 3
