[package]
name = "quizz-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "quizz"

[dependencies]
quizz-core = { path = "../../bctx/core" }
quizz-common = { path = "../../bctx/common" }
quizz-auth = { path = "../../bctx/auth" }

actix-web = "4.9.0"
tokio.workspace = true
serde = { version = "1.0.218", features = ["derive"] }
config = "0.15.19"
bcrypt = "0.19.3"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait.workspace = true
serde_json = "1.0.140"
actix-cors = "0.7.1"
futures = "0.3"
chrono.workspace = true
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
redis = { version = "1.0.2", features = ["tokio-comp", "connection-manager"] }

mongodb = "3.4.1"
casbin = "2"

[dev-dependencies]
# Solo para nombrar el tipo de petición de los servicios de test de actix-web.
actix-http = "3"
