# Configuración de `cargo deny check`: avisos de RustSec, licencias, crates prohibidos y
# orígenes de las dependencias. Cada excepción lleva su motivo.

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0249", reason = "smartstring sin mantenimiento, sin vulnerabilidad conocida; lo exige casbin (via rhai). Revisar al actualizar casbin." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# Los crates del workspace no se publican (publish = false).
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
