[workspace]
resolver = "3"

members = [
    # Subdominio basico
    "bctx/core",

    # Subdominios de soporte
    "bctx/auth",
    "bctx/common",

    # API
    "cmd/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Con resolver 3 la resolución de dependencias respeta esta versión mínima.
rust-version = "1.99"
publish = false

# Versiones compartidas, declaradas una sola vez.
[workspace.dependencies]
async-trait = "0.1.92"
chrono = "0.4.42"
chrono-tz = "0.10.4"
regex = "1.11"
thiserror = "2.0.16"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.18", features = ["v4"] }
